version: "3.9"

services:
  llm-backend:
    build: ./backend
    container_name: llm-backend
    environment:
      - DATA_DIR=/mnt/data
    volumes:
      - ../../airflow/data/raw:/mnt/data:ro   
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  llm-frontend:
    build: ./frontend
    container_name: llm-frontend
    environment:
      - BACKEND_URL=http://llm-backend:8200
    ports:
      - "7862:7862"
    depends_on:
      llm-backend:
        condition: service_healthy
    restart: unless-stopped
